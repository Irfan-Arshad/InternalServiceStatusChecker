version: 0.2

env:
  variables:
    IMAGE_NAME: irfantechno/issc-api

phases:
  pre_build:
    commands:
      - echo Logging in to Docker Hub...
      - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

  build:
    commands:
      - echo Building Docker image...
      - docker build -t $IMAGE_NAME:latest .
      - docker push $IMAGE_NAME:latest

  post_build:
    commands:
      - echo Deploying to Kubernetes...
      - ssh -o StrictHostKeyChecking=no ubuntu@16.16.218.161 "kubectl apply -f ~/InternalServiceStatusChecker/issc-deploy-dh.yaml"
